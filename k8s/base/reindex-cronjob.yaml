apiVersion: batch/v1
kind: CronJob
metadata:
  name: reindex
  namespace: rahbar
  labels:
    app: indexer
spec:
  schedule: "0 2 * * 0"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        metadata:
          labels:
            app: indexer
        spec:
          serviceAccountName: rahbar-indexer
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
          containers:
            - name: indexer
              image: rahbar-indexer:latest
              imagePullPolicy: IfNotPresent
              command: ["python", "-m", "pipeline.run"]
              args: ["--dummy"]
              envFrom:
                - configMapRef:
                    name: rahbar-config
              resources:
                requests:
                  cpu: 200m
                  memory: 512Mi
                limits:
                  cpu: 1000m
                  memory: 1536Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: false
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
