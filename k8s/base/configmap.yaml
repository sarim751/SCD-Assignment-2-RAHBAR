apiVersion: v1
kind: ConfigMap
metadata:
  name: rahbar-config
  namespace: rahbar
data:
  CHUNK_SIZE: "400"
  CHUNK_OVERLAP: "50"
  TOP_K: "5"
  RELEVANCE_FLOOR: "0.65"
  CACHE_THRESHOLD: "0.88"
  TEMPERATURE: "0.2"
  EMBED_MODEL: "nomic-embed-text"
  LLM_PROVIDER: "ollama-host"
  LLM_MODEL: "qwen2.5:0.5b"
  CHROMA_HOST: "chroma"
  CHROMA_PORT: "8000"
  CHROMA_COLLECTION: "rahbar"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  OLLAMA_URL: "http://host.minikube.internal:11434"
  LOG_LEVEL: "INFO"
  RETRIEVER: "chroma"
