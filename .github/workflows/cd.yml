name: CD Pipeline

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Test & Verify
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt
          pip install -r api/requirements-dev.txt
          pip install -r indexer/requirements.txt
          pip install -r indexer/requirements-dev.txt
          pip install pytest pytest-cov

      - name: Run Pytest
        run: |
          pytest api/tests indexer/tests --cov=api/app --cov=indexer/pipeline

  build-push:
    name: Build & Push Images to Docker Hub
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push API Image
        uses: docker/build-push-action@v5
        with:
          context: ./api
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-api:${{ github.sha }}

      - name: Build and Push Indexer Image
        uses: docker/build-push-action@v5
        with:
          context: ./indexer
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-indexer:${{ github.sha }}

      - name: Build and Push UI Image
        uses: docker/build-push-action@v5
        with:
          context: ./ui
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-ui:${{ github.sha }}

  deploy:
    name: Deploy to Ephemeral Cluster & Verify
    needs: build-push
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Kind Cluster
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: kind
          version: v0.23.0

      - name: Deploy Kubernetes Manifests
        run: |
          kubectl apply -k k8s/overlays/prod

      - name: Set Images with Commit SHA
        run: |
          kubectl set image deployment/api api=${{ secrets.DOCKERHUB_USERNAME }}/rahbar-api:${{ github.sha }} -n rahbar || true
          kubectl set image deployment/ui ui=${{ secrets.DOCKERHUB_USERNAME }}/rahbar-ui:${{ github.sha }} -n rahbar || true

      - name: Wait for API Rollout Status
        run: |
          kubectl rollout status deployment/api -n rahbar --timeout=180s || true

      - name: Wait for UI Rollout Status
        run: |
          kubectl rollout status deployment/ui -n rahbar --timeout=120s || true

      - name: Smoke Test through Ingress
        run: |
          kubectl get pods -n rahbar
          kubectl get services -n rahbar
          kubectl get ingress -n rahbar
