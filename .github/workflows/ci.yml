name: CI Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [dev]

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Linters
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.8.4 mypy==1.13.0

      - name: Run Ruff Lint
        run: ruff check .

      - name: Run Mypy
        run: mypy api/app --ignore-missing-imports || true

  test:
    name: Unit Tests & Coverage
    needs: lint
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt
          pip install -r api/requirements-dev.txt
          pip install -r indexer/requirements.txt
          pip install -r indexer/requirements-dev.txt
          pip install pytest pytest-cov

      - name: Run Pytest with Coverage
        env:
          PYTHONPATH: "api:indexer"
        run: |
          pytest api/tests indexer/tests --cov=api/app --cov=indexer/pipeline --cov-report=term-missing --cov-fail-under=60

  manifests:
    name: Validate Manifests
    needs: lint
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Kustomize & Kubeconform
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/
          curl -sLO https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar xf kubeconform-linux-amd64.tar.gz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate with Kubeconform
        run: |
          kustomize build k8s/overlays/prod | kubeconform -strict -summary -ignore-missing-schemas -kubernetes-version 1.30.0

  build:
    name: Build Images
    needs: [test, manifests]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Image
        run: |
          docker build -t rahbar-api:${{ github.sha }} api/

      - name: Build Indexer Image
        run: |
          docker build -t rahbar-indexer:${{ github.sha }} indexer/

      - name: Build UI Image
        run: |
          docker build -t rahbar-ui:${{ github.sha }} ui/

  scan:
    name: Vulnerability Scan
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build local API image for scan
        run: docker build -t rahbar-api:${{ github.sha }} api/

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: rahbar-api:${{ github.sha }}
          format: "table"
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

  e2e-eval:
    name: E2E Evaluation Gate
    needs: scan
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt
          pip install -r indexer/requirements.txt
          pip install pyyaml httpx

      - name: Create Kind Ephemeral Cluster
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: kind
          version: v0.23.0

      - name: Build & Load Docker Images into Kind
        run: |
          docker build -t rahbar-api:${{ github.sha }} api/
          docker build -t rahbar-indexer:${{ github.sha }} indexer/
          docker build -t rahbar-ui:${{ github.sha }} ui/
          kind load docker-image rahbar-api:${{ github.sha }} --name kind
          kind load docker-image rahbar-indexer:${{ github.sha }} --name kind
          kind load docker-image rahbar-ui:${{ github.sha }} --name kind

      - name: Deploy Kubernetes Manifests
        run: |
          kubectl apply -k k8s/overlays/dev
          kubectl set image deployment/api api=rahbar-api:${{ github.sha }} -n rahbar
          kubectl set image deployment/ui ui=rahbar-ui:${{ github.sha }} -n rahbar

      - name: Run Indexer Job on Fixtures
        run: |
          kubectl apply -f k8s/base/indexer-job.yaml -n rahbar
          kubectl wait --for=condition=complete job/indexer -n rahbar --timeout=180s || true

      - name: Wait for API Rollout
        run: |
          kubectl rollout status deployment/api -n rahbar --timeout=120s || true

      - name: Run Evaluation Gate
        run: |
          python eval/run_eval.py --fixtures || true
